# Build + release. The pipeline itself lives in the public app-builder kit, so a fix
# there reaches every app at once — do not inline it here.
#
# deploy_path is deliberately empty: this app's Pages site is the legacy main//docs
# build, so the pipeline publishes the EXE/APK release and leaves Pages alone.
name: Build portable EXE + Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@49c2e0b172890f9334bbc7167a0e7fb5cd3756ba
    with:
      app_name: app-organon-reader
      app_src: docs
      deploy_path: ""
    permissions:
      contents: write
      pages: write
      actions: write    # the shot job dispatches the run that publishes its picture
      id-token: write
